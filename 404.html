<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · ProtoLink Diagnostics</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <!-- Self-contained: GitHub Pages serves this file at ANY missing URL, so relative asset paths would break. -->
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#d6dde6;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
    .c{max-width:460px;background:#151b23;border:1px solid #263040;border-radius:8px;padding:24px}
    h1{margin:0 0 8px;font-size:1.3rem;color:#fff} h1 span{color:#ffb000}
    p{color:#8b98a8} code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#ffb000}
    a{display:inline-block;margin-top:8px;background:#ffb000;color:#111;font-weight:700;text-decoration:none;padding:12px 18px;border-radius:6px}
  </style>
</head>
<body>
  <div class="c">
    <h1>404 · <span>Not found</span></h1>
    <p>That page doesn't exist. Error <code>0x80040154</code>-style: the class you asked for isn't registered here.</p>
    <a id="home" href="/">Back to ProtoLink</a>
  </div>
  <script>
    // Project pages live at /<repo>/ ; user/org pages live at /. Adjust if you use a custom domain.
    (function () {
      var seg = location.pathname.split('/').filter(Boolean)[0];
      var isProjectPage = /\.github\.io$/.test(location.hostname) && seg;
      document.getElementById('home').href = isProjectPage ? '/' + seg + '/' : '/';
    })();
  </script>
</body>
</html>
